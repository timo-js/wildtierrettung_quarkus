# -- Allgemein ---------------------------------------------------------------------------------------------------------
quarkus.http.port=${PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.auth.basic=true
quarkus.log.level=INFO
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=wildtierrettung
# -- DB ----------------------------------------------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=update
# -- Dev ---------------------------------------------------------------------------------------------------------------
%dev,test.quarkus.datasource.db-kind=h2
%dev,test.quarkus.hibernate-orm.database.generation=drop-and-create
%dev,test.quarkus.hibernate-orm.sql-load-script=importiereTestdaten.sql
%dev.quarkus.hibernate-orm.log.sql=false
# -- Konfiguriere embedded authentication ------------------------------------------------------------------------------
%dev.quarkus.security.users.embedded.enabled=true
%dev.quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.testadmin=admin,pilot
%dev.quarkus.security.users.embedded.roles.testadmin=ADMIN,PILOT
%dev.quarkus.security.users.embedded.users.testpilot=pilot
%dev.quarkus.security.users.embedded.roles.testpilot=PILOT
%dev.quarkus.security.users.embedded.users.testzuschauer=zuschauer
%dev.quarkus.security.users.embedded.roles.testzuschauer=ZUSCHAUER
