plugins {
    id 'java'
    id 'io.quarkus' version "${quarkusVersion}"
    id 'io.freefair.lombok' version "${lombokVersion}"
}

group 'de.vink.timo.wildtierrettung'
version '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.quarkus:quarkus-security-jpa',
            implementation("io.quarkus:quarkus-elytron-security-jdbc")
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:${quarkusVersion}"),
        'io.quarkus:quarkus-hibernate-orm',
        'io.quarkus:quarkus-hibernate-orm-panache',
        'io.quarkus:quarkus-narayana-jta',
        'io.quarkus:quarkus-hibernate-validator',
        'io.quarkus:quarkus-resteasy-jsonb',
        'io.quarkus:quarkus-smallrye-openapi',
        'io.quarkus:quarkus-jdbc-postgresql',
        'io.quarkus:quarkus-jdbc-h2',
        'io.quarkus:quarkus-arc',
        'commons-beanutils:commons-beanutils:1.9.4',
        'io.quarkus:quarkus-smallrye-jwt',
        'io.quarkus:quarkus-smallrye-jwt-build',
        'io.quarkus:quarkus-swagger-ui'
    testImplementation 'io.quarkus:quarkus-junit5',
        'io.rest-assured:rest-assured'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}
